name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  chart:
    name: helm lint + render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - run: helm lint ./chart --strict
      - name: render with overrides and check values propagate
        run: |
          helm template demo ./chart --set replicaCount=3 --set config.appName=ci-app --set ingress.host=ci.local > /tmp/out.yaml
          grep -q 'replicas: 3' /tmp/out.yaml
          grep -q 'APP_NAME: "ci-app"' /tmp/out.yaml
          grep -q 'host: "ci.local"' /tmp/out.yaml
      - run: helm lint ./lab/broken-chart

  image:
    name: build + trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: ./service
          tags: demo-service:${{ github.sha }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test
        run: |
          docker run -d --rm --name smoke -p 8080:8080 -e APP_NAME=ci -e VERSION=${{ github.sha }} demo-service:${{ github.sha }}
          for i in $(seq 1 10); do curl -sf http://localhost:8080/healthz && break; sleep 1; done
          curl -sf http://localhost:8080/ | tee /dev/stderr | grep -q '"app": "ci"'
          test "$(docker exec smoke id -u)" = "10001"
          docker stop smoke
      - name: trivy (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: demo-service:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library
      - name: trivy config (Dockerfile + chart misconfigurations)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"
          severity: HIGH,CRITICAL
          skip-dirs: lab
