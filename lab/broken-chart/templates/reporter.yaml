apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporter
  labels:
    app: reporter
    {{- include "lab.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.reporter.replicas }}
  selector:
    matchLabels:
      app: reporter
  template:
    metadata:
      labels:
        app: reporter
        {{- include "lab.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.reporter.serviceAccountName }}
      containers:
        - name: reporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.common.port }}
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- range $name, $value := .Values.reporter.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.common.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.reporter.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: reporter
  labels:
    app: reporter
    {{- include "lab.labels" . | nindent 4 }}
spec:
  selector:
    app: reporter
  ports:
    - name: http
      port: 8080
      targetPort: {{ .Values.common.port }}
