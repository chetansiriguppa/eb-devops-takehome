# Debug lab — values.
#
# Lab rules (also in the assignment):
#   * You may change anything in this chart — values or templates.
#   * You may NOT change image.repository or image.tag.
#   * You may NOT modify anything under ../cluster-state/.
#   * You may NOT delete workloads to make a symptom disappear.

image:
  repository: docker.io/ebinterview/eb-debug-app
  tag: "1.0.1"
  pullPolicy: IfNotPresent

common:
  # Every workload serves plain HTTP on this port.
  port: 8080

backend:
  replicas: 1
  env:
    APP_MODE: "api"
    APP_NAME: "backend"
    VERSION: "2.0.0"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

gateway:
  replicas: 1
  env:
    APP_MODE: "gateway"
    APP_NAME: "gateway"
    VERSION: "2.0.0"
    BACKEND_URL: "http://backend.default.svc:8080"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

worker:
  replicas: 1
  env:
    APP_MODE: "worker"
    APP_NAME: "worker"
    VERSION: "2.0.0"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

reporter:
  replicas: 1
  serviceAccountName: reporter
  env:
    APP_MODE: "reporter"
    APP_NAME: "reporter"
    VERSION: "2.0.0"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

metrics:
  replicas: 1
  env:
    APP_MODE: "api"
    APP_NAME: "metrics"
    VERSION: "2.0.0"
  resources:
    requests:
      cpu: "2"
      memory: "64Mi"
    limits:
      cpu: "4"
      memory: "128Mi"

migrate:
  enabled: true
  backoffLimit: 2
