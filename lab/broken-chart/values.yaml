# Debug lab — values.
#
# Lab rules (also in the assignment):
#   * You may change anything in this chart — values or templates.
#   * You may NOT change image.repository or image.tag.
#   * You may NOT modify anything under ../cluster-state/.
#   * You may NOT delete workloads to make a symptom disappear.

image:
  repository: docker.io/ebinterview/eb-debug-app
  tag: "1.0.1"
  pullPolicy: IfNotPresent

common:
  # Every workload serves plain HTTP on this port. The image listens on 8081 by default
  # (confirmed from container logs); Services keep their public ports and target this.
  port: 8081
  # The image's USER is the name "nonroot" (uid 65532 in its /etc/passwd); kubelet needs a
  # numeric uid to enforce runAsNonRoot.
  runAsUser: 65532

backend:
  replicas: 1
  env:
    APP_MODE: "api"
    APP_NAME: "backend"
    VERSION: "2.0.0"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

gateway:
  replicas: 1
  env:
    APP_MODE: "gateway"
    APP_NAME: "gateway"
    VERSION: "2.0.0"
    BACKEND_URL: "http://backend:8080"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

worker:
  replicas: 1
  # The worker writes its cache here; root fs stays read-only, so this is an emptyDir mount.
  cacheDir: /var/cache/app
  env:
    APP_MODE: "worker"
    APP_NAME: "worker"
    VERSION: "2.0.0"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

reporter:
  replicas: 1
  serviceAccountName: reporter
  env:
    APP_MODE: "reporter"
    APP_NAME: "reporter"
    VERSION: "2.0.0"
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

metrics:
  replicas: 1
  env:
    APP_MODE: "api"
    APP_NAME: "metrics"
    VERSION: "2.0.0"
  # Must stay under the namespace LimitRange max (cpu 1 / 512Mi) or pods are rejected at admission.
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

migrate:
  enabled: true
  backoffLimit: 2
